# .gitlab-ci.yml
# OmniSight GitLab CI/CD Pipeline (macOS Unix Shell Runner)

stages:
  - lint
  - format
  - type_check
  - test
  - coverage
  - security
  - audit
  - deploy
  - release

default:
  tags:
    - local-macos
  before_script:
    - export PATH="/Users/arryasridhar/.local/bin:$PATH"
    - export NVM_DIR="$HOME/.nvm"
    - '[ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"'
    - cd backend
    - uv venv --python 3.11 || true
    - source .venv/bin/activate
    - uv pip install -r requirements.txt

# --- LINT STAGE ---
ruff-check:
  stage: lint
  script:
    - uv pip install ruff
    - python -m ruff check src tests

vulture-check:
  stage: lint
  script:
    - uv pip install vulture
    - vulture src/ --min-confidence 100 || true
  allow_failure: true

pylint-check:
  stage: lint
  script:
    - uv pip install pylint
    - pylint src/ --disable=all --enable=E || true
  allow_failure: true

flake8-check:
  stage: lint
  script:
    - uv pip install flake8
    - flake8 src/ --max-line-length=120 --count || true
  allow_failure: true

pyupgrade-check:
  stage: lint
  script:
    - uv pip install pyupgrade
    - find src -name "*.py" -exec pyupgrade --py311-plus {} + || true
  allow_failure: true

semgrep-check:
  stage: lint
  script:
    - uv pip install semgrep
    - semgrep --config auto src/ || true
  allow_failure: true

eslint-web:
  stage: lint
  before_script:
    - export PATH="/Users/arryasridhar/.local/bin:$PATH"
    - export NVM_DIR="$HOME/.nvm"
    - '[ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"'
  script:
    - cd frontend
    - npm install
    - npm run lint

# --- FORMAT STAGE ---
black-check:
  stage: format
  script:
    - uv pip install black
    - python -m black --check src tests

# --- TYPE_CHECK STAGE ---
mypy-check:
  stage: type_check
  script:
    - uv pip install mypy
    - python -m mypy src || exit 0

# --- TEST STAGE ---
unit-tests:
  stage: test
  script:
    - uv pip install pytest pytest-cov httpx
    - PYTHONPATH=".." python -m pytest tests/ --cov=src --cov-report=term --cov-fail-under=0
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'

frontend-build:
  stage: test
  before_script:
    - export PATH="/Users/arryasridhar/.local/bin:$PATH"
    - export NVM_DIR="$HOME/.nvm"
    - '[ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"'
  script:
    - cd frontend
    - npm install
    - npm run build

# --- COVERAGE STAGE ---
coverage-report:
  stage: coverage
  script:
    - uv pip install pytest pytest-cov httpx
    - PYTHONPATH=".." python -m pytest tests/ --cov=src --cov-report=term --cov-report=html --cov-fail-under=0 || true
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    paths:
      - backend/htmlcov/
    expire_in: 7 days
  allow_failure: true

# --- SECURITY STAGE ---
secret-scanning:
  stage: security
  script:
    - uv pip install trufflehog3
    - trufflehog3 --no-history . || true
  allow_failure: true

dependency-audit:
  stage: security
  script:
    - uv pip install pip-audit
    - pip-audit -r requirements.txt || true
  allow_failure: true

security-scan:
  stage: security
  script:
    - uv pip install bandit
    - python -m bandit -r src/ -ll
  allow_failure: true

# --- AUDIT STAGE ---
repo_audit:
  stage: audit
  before_script:
    - export PATH="/Users/arryasridhar/.local/bin:$PATH"
    - export NVM_DIR="$HOME/.nvm"
    - '[ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"'
  script:
    - python3 tools/repo_audit.py

# --- DEPLOY STAGE ---
pages:
  stage: deploy
  before_script:
    - export PATH="/Users/arryasridhar/.local/bin:$PATH"
    - export NVM_DIR="$HOME/.nvm"
    - '[ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"'
  script:
    - cd frontend
    - npm install
    - npm run build
    - mv dist ../public
  artifacts:
    paths:
      - public
  environment:
    name: production
    url: $CI_PAGES_URL
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# --- RELEASE STAGE ---
changelog:
  stage: release
  before_script:
    - export PATH="/Users/arryasridhar/.local/bin:$PATH"
  script:
    - uv pip install git-cliff || true
    - git-cliff -o CHANGELOG.md || true
    - echo "Changelog generated."
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
