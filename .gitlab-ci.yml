# .gitlab-ci.yml
# OmniSight GitLab CI/CD Pipeline (macOS Unix Shell Runner)

stages:
  - lint
  - format
  - type_check
  - test
  - security
  - audit
  - deploy
  - release

default:
  tags:
    - local-macos
  before_script:
    - export PATH="/Users/arryasridhar/.local/bin:$PATH"
    - export NVM_DIR="$HOME/.nvm"
    - '[ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"'
    - cd backend
    - uv venv --python 3.11 || true
    - source .venv/bin/activate
    - uv pip install -r requirements.txt

# --- LINT STAGE ---
ruff-check:
  stage: lint
  script:
    - uv pip install ruff vulture flake8 pylint pyupgrade
    - python -m ruff check src tests
    - vulture src/
    - flake8 src/
    - pylint src/
    - pyupgrade `find src -name "*.py"` || true

eslint-web:
  stage: lint
  before_script:
    - export PATH="/Users/arryasridhar/.local/bin:$PATH"
    - export NVM_DIR="$HOME/.nvm"
    - '[ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"'
  script:
    - cd frontend
    - npm install
    - npm run lint

# --- FORMAT STAGE ---
black-check:
  stage: format
  script:
    - uv pip install black
    - python -m black --check src tests

# --- TYPE_CHECK STAGE ---
mypy-check:
  stage: type_check
  script:
    - uv pip install mypy
    - python -m mypy src || exit 0

# --- TEST STAGE ---
unit-tests:
  stage: test
  script:
    - uv pip install pytest pytest-cov httpx
    - PYTHONPATH=".." python -m pytest tests/ --cov=src --cov-report=term --cov-fail-under=80
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'

frontend-build:
  stage: test
  before_script:
    - export PATH="/Users/arryasridhar/.local/bin:$PATH"
    - export NVM_DIR="$HOME/.nvm"
    - '[ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"'
  script:
    - cd frontend
    - npm install
    - npm run build

# --- SECURITY STAGE ---
security-scan:
  stage: security
  script:
    - uv pip install bandit trufflehog3 semgrep
    - python -m bandit -r src/ -ll
    - trufflehog3 .
    - semgrep --config auto .
  allow_failure: true

# --- AUDIT STAGE ---
dependency_audit:
  stage: audit
  before_script:
    - export PATH="/Users/arryasridhar/.local/bin:$PATH"
    - export NVM_DIR="$HOME/.nvm"
    - '[ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"'
  script:
    - uv pip install pip-audit
    - pip-audit -r backend/requirements.txt || true
    - python3 tools/repo_audit.py

# --- DEPLOY STAGE ---
pages:
  stage: deploy
  before_script:
    - export PATH="/Users/arryasridhar/.local/bin:$PATH"
    - export NVM_DIR="$HOME/.nvm"
    - '[ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"'
  script:
    - cd frontend
    - npm install
    - npm run build
    - mv dist ../public
  artifacts:
    paths:
      - public
  environment:
    name: production
    url: $CI_PAGES_URL
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# --- RELEASE STAGE ---
cli_release:
  stage: release
  before_script:
    - echo "No setup needed for release"
  script:
    - uv pip install git-cliff
    - git-cliff -o CHANGELOG.md
    - echo "Release job running on Unix Shell."
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

gitlab_compliance:
  stage: release
  before_script:
    - echo "Updating GitLab description and creating release"
  script:
    - 'curl --request PUT --header "JOB-TOKEN: $CI_JOB_TOKEN" "$CI_API_V4_URL/projects/$CI_PROJECT_ID" --data "description=OmniSight: An advanced omni-modal vision and reasoning platform"'
    - 'curl --header "Content-Type: application/json" --header "JOB-TOKEN: $CI_JOB_TOKEN" --data "{\"name\": \"Release $CI_COMMIT_TAG\", \"tag_name\": \"$CI_COMMIT_TAG\", \"description\": \"Release created via CI\"}" --request POST "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases" || true'
  rules:
    - if: $CI_COMMIT_TAG
